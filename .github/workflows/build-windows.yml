name: Build Clipsworld for Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller==6.22.3

      - name: Build engine (PyInstaller)
        working-directory: backend
        run: pyinstaller clipsworld-backend.spec --distpath ../dist-backend --workpath ../build-py --noconfirm

      - name: Download FFmpeg (with libass, x264, NVENC)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          New-Item -ItemType Directory -Force resources/ffmpeg | Out-Null
          Get-ChildItem ffmpeg-tmp -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination resources/ffmpeg
          Get-ChildItem resources/ffmpeg
          resources/ffmpeg/ffmpeg.exe -hide_banner -filters | Select-String -Pattern " subtitles "

      - name: Smoke test engine
        shell: pwsh
        run: |
          $env:CLIPSWORLD_RESOURCES = "$PWD/resources"
          $env:CLIPSWORLD_DATA = "$PWD/smoke-data"
          $p = Start-Process -FilePath dist-backend/clipsworld-backend/clipsworld-backend.exe -ArgumentList "--port","8799" -PassThru -NoNewWindow
          $ok = $false
          for ($i = 0; $i -lt 60; $i++) {
            Start-Sleep -Seconds 1
            try { $r = Invoke-RestMethod http://127.0.0.1:8799/health; if ($r.ok) { $ok = $true; break } } catch {}
          }
          if (-not $ok) { Stop-Process -Id $p.Id -Force; throw "Engine did not start" }
          Invoke-RestMethod http://127.0.0.1:8799/styles | ConvertTo-Json -Depth 2 | Select-Object -First 5
          Invoke-RestMethod http://127.0.0.1:8799/gpu | ConvertTo-Json
          Stop-Process -Id $p.Id -Force
          Write-Host "Engine OK"

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build installer (Electron)
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Clipsworld-Setup
          path: app/release/*.exe
          retention-days: 30

      - name: Publish release (download page)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Clipsworld build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: app/release/*.exe
          make_latest: true
          body: |
            Download **Clipsworld-Setup-*.exe** below and run it.
            Windows may show a SmartScreen warning (the app isn't code-signed): click More info → Run anyway.
