name: Build Clipsworld for Windows

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install engine dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pyinstaller==6.22.3

      - name: Build engine (PyInstaller)
        working-directory: backend
        run: pyinstaller clipsworld-backend.spec --distpath ../dist-backend --workpath ../build-py --noconfirm

      - name: Download FFmpeg (with libass, x264, NVENC)
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          New-Item -ItemType Directory -Force resources/ffmpeg | Out-Null
          Get-ChildItem ffmpeg-tmp -Recurse -Include ffmpeg.exe,ffprobe.exe | Copy-Item -Destination resources/ffmpeg
          Get-ChildItem resources/ffmpeg
          resources/ffmpeg/ffmpeg.exe -hide_banner -filters | Select-String -Pattern " subtitles "

      - name: Download Deno (JavaScript runtime yt-dlp needs for YouTube)
        shell: pwsh
        run: |
          Invoke-WebRequest "https://github.com/denoland/deno/releases/latest/download/deno-x86_64-pc-windows-msvc.zip" -OutFile deno.zip
          New-Item -ItemType Directory -Force resources/deno | Out-Null
          Expand-Archive deno.zip -DestinationPath resources/deno -Force
          resources/deno/deno.exe --version

      - name: Stamp build number
        shell: pwsh
        run: |
          Set-Content -Path app/build-info.json -Value ('{"build": ' + $env:GITHUB_RUN_NUMBER + '}')
          Get-Content app/build-info.json

      - name: End-to-end test on Windows (transcribe + effects + captions + export)
        id: e2e
        continue-on-error: true
        shell: pwsh
        timeout-minutes: 20
        run: |
          Start-Transcript -Path e2e.log
          $ErrorActionPreference = "Stop"
          $env:CLIPSWORLD_RESOURCES = "$PWD/resources"
          $env:CLIPSWORLD_DATA = "$PWD/smoke-data"
          $B = "http://127.0.0.1:8799"
          $p = Start-Process -FilePath dist-backend/clipsworld-backend/clipsworld-backend.exe -ArgumentList "--port","8799" -PassThru -NoNewWindow -RedirectStandardError engine-err.log
          function Wait-Job($id) {
            for ($i = 0; $i -lt 600; $i++) {
              Start-Sleep -Seconds 2
              $j = Invoke-RestMethod "$B/jobs/$id"
              if ($i % 5 -eq 0) { Write-Host "  [$($j.status)] $([math]::Round($j.progress*100))% $($j.stage)" }
              if ($j.status -ne "running") { return $j }
            }
            throw "Job $id timed out"
          }
          try {
            $ok = $false
            for ($i = 0; $i -lt 90; $i++) { Start-Sleep 1; try { if ((Invoke-RestMethod "$B/health").ok) { $ok = $true; break } } catch {} }
            if (-not $ok) { throw "Engine did not start" }
            New-Item -ItemType Directory -Force smoke-out | Out-Null
            resources/ffmpeg/ffmpeg.exe -hide_banner -loglevel error -y -f lavfi -i "testsrc2=size=1280x720:rate=30" -f lavfi -i "sine=frequency=440:sample_rate=48000" -t 20 -c:v libx264 -pix_fmt yuv420p -c:a aac "smoke video.mkv"
            resources/ffmpeg/ffmpeg.exe -hide_banner -loglevel error -y -f lavfi -i "testsrc=size=640x480:rate=30" -f lavfi -i "sine=frequency=330:sample_rate=48000" -t 12 -c:v libvpx -b:v 500k -c:a libopus smoke-out/vo_test.webm
            python tests/full_test.py $B "$PWD/smoke video.mkv" "$PWD/smoke-out" resources/ffmpeg/ffprobe.exe
            if ($LASTEXITCODE -ne 0) { throw "Full feature test failed" }
            Write-Host "END-TO-END OK"
          } finally {
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
            if (Test-Path engine-err.log) { Get-Content engine-err.log -Tail 60 }
            Stop-Transcript
          }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - name: Build installer (Electron)
        working-directory: app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: |
          npm ci
          npm run dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: Clipsworld-Setup
          path: app/release/*.exe
          retention-days: 30

      - name: Publish release (download page)
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('build-{0}', github.run_number) }}
          name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || format('Clipsworld build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          files: app/release/*.exe
          make_latest: true
          body: |
            Windows end-to-end test: **${{ steps.e2e.outcome }}**

            Download **Clipsworld-Setup-*.exe** below and run it. Installing over an older version keeps your projects and settings.
            Windows may show a SmartScreen warning (the app isn't code-signed): click More info → Run anyway.

      - name: Save CI log to the ci-logs branch (for debugging)
        if: always()
        shell: pwsh
        run: |
          $log = "$env:RUNNER_TEMP/ci-log.txt"
          "run=$env:GITHUB_RUN_NUMBER sha=$env:GITHUB_SHA e2e=${{ steps.e2e.outcome }} job=${{ job.status }}" | Out-File $log -Encoding utf8
          if (Test-Path e2e.log) { Get-Content e2e.log | Out-File $log -Append -Encoding utf8 }
          $d = "$env:RUNNER_TEMP/cilog"
          New-Item -ItemType Directory -Force $d | Out-Null
          Copy-Item $log "$d/ci-log.txt"
          Set-Location $d
          git init -q
          git checkout -q -b ci-logs
          git config user.name "clipsworld-ci"
          git config user.email "ci@users.noreply.github.com"
          git add ci-log.txt
          git commit -q -m "CI log for run $env:GITHUB_RUN_NUMBER"
          git push -f -q "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-logs
